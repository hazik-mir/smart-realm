<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — SmartRealm</title>
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #ffd83d;
      color: #171717;
      font-family: Arial, sans-serif;
    }

    main {
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(100px, 25vw, 190px);
      line-height: 0.9;
    }

    h2 {
      margin: 20px 0 8px;
      font-size: 24px;
    }

    p {
      margin: 0;
      color: #45402e;
    }

    a {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 20px;
      border-radius: 4px;
      background: #171717;
      color: #ffd83d;
      font-weight: bold;
      text-decoration: none;
    }

    a:hover {
      background: #333;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>Looks like this page got lost in the realm.</p>
    <a href="/">Back to SmartRealm</a>
  </main>
</body>
</html>
